<svg xmlns="http://www.w3.org/2000/svg" width="600" height="96" viewBox="0 0 600 96">
  <defs>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#BC8CFF">
        <animate attributeName="offset" values="0.5;0.15;0.85;0.5"
                 dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#39D353"/>
    </linearGradient>
  </defs>

  <text x="300" y="56" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="52" font-weight="700" fill="url(#sweep)">Baban</text>

  <rect x="240" y="72" width="120" height="3" rx="1.5" fill="url(#sweep)" opacity="0.85">
    <animate attributeName="width" values="120;180;120" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x" values="240;210;240" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
