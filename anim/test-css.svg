<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80">
  <style>
    .t { font-family: Helvetica, Arial, sans-serif; font-size: 44px; font-weight: bold;
         opacity: 0; animation: in 1s ease forwards; }
    @keyframes in { to { opacity: 1; } }
  </style>
  <!-- starts invisible; only becomes visible if CSS in <style> is applied -->
  <text x="300" y="52" text-anchor="middle" class="t" fill="#F778BA">CSS-OK</text>
</svg>
